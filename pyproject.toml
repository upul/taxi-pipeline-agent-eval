[project]
name = "taxi-pipeline-agent-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.3",
    "duckdb>=2.0.0",
    "openai>=3.51.0",
    "openinference-instrumentation-openai>=0.1.74",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"] # Basic rules + isort (I)
ignore = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]
